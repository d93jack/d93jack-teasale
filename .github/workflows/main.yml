name: AI Market Reports

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Report edition
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening
          - weekly
          - sunday-check
      dry_run:
        description: Test without calling OpenAI API
        required: true
        default: false
        type: boolean
  schedule:
    # Start early enough to finish before the agreed reading deadline.
    - cron: "15 7 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "15 19 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "0 11 * * 6"
      timezone: "Asia/Taipei"
    - cron: "30 8 * * 0"
      timezone: "Asia/Taipei"

permissions:
  contents: write

concurrency:
  group: ai-market-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangoft2-1.0-0

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Resolve report edition
        id: edition
        shell: bash
        env:
          MANUAL_EDITION: ${{ inputs.edition }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_VALUE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            edition="$MANUAL_EDITION"
            dry_run="$MANUAL_DRY_RUN"
          else
            dry_run="false"
            case "$SCHEDULE_VALUE" in
              "15 7 * * 1-5") edition="morning" ;;
              "15 19 * * 1-5") edition="evening" ;;
              "0 11 * * 6") edition="weekly" ;;
              "30 8 * * 0") edition="sunday-check" ;;
              *) echo "Unknown schedule: $SCHEDULE_VALUE" >&2; exit 1 ;;
            esac
          fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - name: Generate reports
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'medium' }}
        run: |
          args=(--edition "${{ steps.edition.outputs.edition }}")
          if [[ "${{ steps.edition.outputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python src/generate_report.py "${args[@]}"

      - name: Read generation result
        id: result
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("run_result.json", encoding="utf-8"))
          print(f"generated={str(data['generated']).lower()}")
          print(f"date={data['date']}")
          print(f"edition={data['edition']}")
          PY

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-market-${{ steps.result.outputs.date }}-${{ steps.result.outputs.edition }}
          path: |
            reports/
            history/
            run_result.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated reports
        if: steps.edition.outputs.dry_run != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports history
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "report: ${{ steps.result.outputs.date }} ${{ steps.result.outputs.edition }}"
          git push

